name: busan_fish_app
description: A new Flutter project for Busan Smart Fishing.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  tflite_flutter: ^0.12.1
  image: ^4.1.3
  camera: ^0.11.0
  image_picker: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fish_model_float16.tflite
    - assets/labels.txt
    - assets/fish_rules.json
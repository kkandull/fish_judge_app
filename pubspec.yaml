name: busan_fish_app
description: A new Flutter project for Busan Smart Fishing.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_launcher_icons: ^0.14.1
  
  tflite_flutter: ^0.12.1
  image: ^4.8.0
  camera: ^0.11.0
  image_picker: ^1.2.2

  http: ^1.6.0
  url_launcher: ^6.2.6
  geolocator: ^11.0.1
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5
  path: ^1.9.0
  share_plus: ^10.0.0
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.0
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.2.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_map_marker_cluster: ^1.4.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^21.0.0
  connectivity_plus: ^7.1.1
  google_generative_ai: ^0.4.6
  firebase_remote_config: ^5.1.0
  flutter_native_splash: ^2.4.0   # ✅ dependencies로 이동 (runtime 제거용)
  geocoding: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fish_model_float16.tflite
    - assets/labels.txt
    - assets/fish_rules.json
    - assets/ic_launcher_foreground.png
    - assets/ic_launcher_background.png
    - assets/models/fishing_score_model.tflite
    - assets/fishing_norm_params.json
    - assets/app_icon.png
    - assets/splash_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "assets/ic_launcher_background.png"
  adaptive_icon_foreground: "assets/ic_launcher_foreground.png"

# ✅ 네이티브 스플래시: 흰 배경만, 아이콘 없음 → 거의 안 보임
flutter_native_splash:
  color: "#ffffff"
  fullscreen: false         # ✅ true 제거 → 상태바 깜빡임 방지
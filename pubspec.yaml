name: busan_fish_app
description: A new Flutter project for Busan Smart Fishing.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # [조장님 담당] AI 모델 및 카메라 계측 관련 패키지
  tflite_flutter: ^0.12.1
  image: ^4.1.3
  camera: ^0.11.0
  image_picker: ^1.2.2

  # ✨ [새로 추가된 패키지] 팀원들 기능 구현용 ✨
  http: ^1.2.1             # [표재국 담당] 기상청/바다타임 API 통신용
  url_launcher: ^6.2.6     # [강태한/김승연 담당] 쿠팡 장비 추천 및 주변 편의시설 지도 링크 연결용
  geolocator: ^11.0.1      # [표재국 담당] 위치 기반 사고 위험(테트라포드 등) 안내용 GPS 패키지
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fish_model_float16.tflite
    - assets/labels.txt
    - assets/fish_rules.json  